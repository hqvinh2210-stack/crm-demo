version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/crm
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change_this_secret_key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      OPENAI_API_KEY: ""
      ALLOWED_ORIGINS: "*"

volumes:
  postgres_data:
