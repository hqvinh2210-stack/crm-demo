<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Dashboard - Multi-Page</title>
  <style>
    /* Copied styles from app/static/index.html to keep UI identical */
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #edf2fb; color: #0f2137; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .layout { display: grid; grid-template-columns: 260px 1fr; gap: 28px; padding: 28px; min-height: 100vh; }
    .sidebar { background: #0f4c81; border-radius: 28px; padding: 28px 20px; color: white; display: flex; flex-direction: column; justify-content: space-between; height: fit-content; position: sticky; top: 24px; }
    .sidebar h1 { margin: 0 0 28px; font-size: 1.4rem; letter-spacing: .05em; }
    .nav-link { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; padding: 12px 14px; border-radius: 16px; color: rgba(255,255,255,.88); text-decoration: none; font-weight: 500; cursor: pointer; border: none; background: none; width: 100%; font-family: inherit; font-size: inherit; }
    .nav-link.active, .nav-link:hover { background: rgba(255,255,255,.12); color: white; }
    .nav-link span { width: 20px; text-align: center; }
    .sidebar footer { margin-top: auto; font-size: .92rem; opacity: .85; }
    .main-content { display: flex; flex-direction: column; gap: 32px; }
    .page { display: none; }
    .page.active { display: flex; flex-direction: column; gap: 28px; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
    .topbar h2 { margin: 0; font-size: 1.6rem; font-weight: 700; }
    .topbar p { margin: 8px 0 0; color: #64748b; font-size: 0.96rem; }
    .top-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .button { border: none; border-radius: 14px; padding: 12px 18px; font-weight: 600; cursor: pointer; font-size: 0.95rem; font-family: inherit; }
    .button.primary { background: #1b6efa; color: white; }
    .button.secondary { background: rgba(15,76,129,.1); color: #0f4c81; }
    .button:hover { opacity: 0.9; }
    .back-btn { display: flex; align-items: center; gap: 8px; background: rgba(15,76,129,.1); color: #0f4c81; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 24px; width: 100%; }
    .card { background: white; border-radius: 24px; padding: 28px; box-shadow: 0 20px 50px rgba(15,76,129,.08); min-width: 0; overflow: hidden; }
    .card small { display: block; color: #64748b; margin-bottom: 12px; font-size: 0.9rem; }
    .card .large { font-size: 2.2rem; font-weight: 700; margin-bottom: 12px; line-height: 1.2; }
    .card .delta { color: #16a34a; font-weight: 600; font-size: 0.95rem; }
    .chart-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 1fr); gap: 28px; align-items: stretch; width: 100%; }
    .chart { background: white; border-radius: 24px; padding: 28px; box-shadow: 0 20px 50px rgba(15,76,129,.08); min-width: 0; overflow: hidden; }
    .chart header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .chart header h3 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    .chart-list { display: grid; gap: 14px; }
    .bar-row { display: grid; grid-template-columns: minmax(120px, 160px) minmax(160px, 1fr) 56px; gap: 14px; align-items: center; padding: 12px 8px; cursor: pointer; transition: background 0.2s; border-radius: 8px; }
    .bar-row:hover { background: rgba(27,110,250,.05); }
    .bar-label { font-size: .9rem; color: #334155; word-break: break-word; font-weight: 500; }
    .bar-track { width: 100%; height: 14px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
    .bar-value { text-align: right; font-size: .85rem; color: #334155; font-weight: 600; }
    .details-grid { display: grid; gap: 28px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; width: 100%; }
    .table { width: 100%; min-width: 680px; border-collapse: collapse; }
    .table thead tr { background: #f8fafc; }
    .table th, .table td { padding: 16px 18px; text-align: left; font-size: 0.96rem; color: #334155; }
    .table th { color: #64748b; font-weight: 600; font-size: 0.92rem; }
    .table tr { border-bottom: 1px solid #e2e8f0; cursor: pointer; }
    .table tr:hover { background: #f8fafc; }
    .tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; }
    .tag.green { background: #dcfce7; color: #15803d; }
    .tag.yellow { background: #fef9c3; color: #b45309; }
    .tag.blue { background: #dbeafe; color: #1d4ed8; }
    .tag.gray { background: #e2e8f0; color: #475569; }
    .legend { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
    .legend-item { display: flex; align-items: center; gap: 10px; font-size: 0.94rem; color: #475569; }
    .legend-color { width: 12px; height: 12px; border-radius: 999px; }
    .chat-container { display: flex; flex-direction: column; height: 100%; }
    .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .chat-message { display: flex; gap: 8px; }
    .chat-message.inbound { justify-content: flex-start; }
    .chat-message.outbound { justify-content: flex-end; }
    .message-bubble { max-width: 80%; padding: 12px 16px; border-radius: 16px; word-wrap: break-word; line-height: 1.4; }
    .message-bubble.inbound { background: #e3f2fd; color: #0f2137; border-radius: 16px 16px 16px 4px; }
    .message-bubble.outbound { background: #1b6efa; color: white; border-radius: 16px 16px 4px 16px; }
    .message-time { font-size: .75rem; color: #64748b; margin-top: 6px; display: block; }
    .message-bubble.inbound .message-time { color: #0f2137; opacity: .6; }
    .message-bubble.outbound .message-time { color: white; opacity: .8; }
    .chat-footer { padding: 16px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; align-items: flex-end; }
    .chat-input { flex: 1; border: 1px solid #e2e8f0; border-radius: 20px; padding: 12px 16px; font-size: .9rem; font-family: inherit; resize: none; max-height: 80px; }
    .chat-input:focus { outline: none; border-color: #1b6efa; }
    .chat-send-btn { background: #1b6efa; color: white; border: none; border-radius: 50%; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 600; transition: background 0.2s; }
    .chat-send-btn:hover { background: #1550d8; }
    .chat-send-btn:disabled { background: #cbd5e0; cursor: not-allowed; }
    @media (max-width: 1280px) { .layout { grid-template-columns: 1fr; } .summary-grid { grid-template-columns: repeat(2, minmax(220px, 1fr)); } .chart-grid, .details-grid { grid-template-columns: 1fr; } .card:has(.table) { overflow-x: auto; } }
    @media (max-width: 760px) { .layout { padding: 16px; gap: 16px; } .summary-grid { grid-template-columns: 1fr; } .card, .chart { padding: 20px; border-radius: 20px; } .bar-row { grid-template-columns: 1fr; gap: 8px; } .bar-value { text-align: left; } }
  </style>
</head>
